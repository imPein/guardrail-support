<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="联系护栏 App 开发者并提交使用反馈">
  <title>联系与反馈 · 护栏</title>
  <link rel="stylesheet" href="styles.css">
  <script src="contact.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="index.html">护栏</a>
    <nav aria-label="页面导航">
      <a href="index.html">帮助</a>
      <a href="contact.html" aria-current="page">联系</a>
      <a href="privacy.html">隐私政策</a>
      <a href="terms.html">使用条款</a>
    </nav>
  </header>
  <main>
    <h1>联系与反馈</h1>
    <p class="lead">遇到问题或有建议，可以直接联系护栏开发者。</p>

    <section class="contact-panel" aria-labelledby="wechat-title">
      <div class="contact-copy">
        <p class="eyebrow">微信</p>
        <h2 id="wechat-title">搜索微信号添加</h2>
        <p>复制微信号后，在微信中搜索添加。也可以长按下方二维码保存或分享。</p>

        <div class="copy-row">
          <code id="wechat-id">mypein</code>
          <button type="button" data-copy-wechat="mypein">复制微信号</button>
        </div>
        <p class="copy-status" role="status" aria-live="polite"></p>
      </div>

      <figure class="qr-figure">
        <a href="wechat-qr.png" download="mypein-wechat-qr.png" aria-label="打开微信添加好友二维码原图">
          <img src="wechat-qr.png" width="797" height="802" alt="微信添加好友二维码">
        </a>
        <figcaption>长按二维码保存或分享</figcaption>
      </figure>
    </section>

    <section class="email-contact" aria-labelledby="email-title">
      <p class="eyebrow">邮箱</p>
      <h2 id="email-title">也可以发送邮件</h2>
      <p>不方便使用微信时，请发邮件至 <a class="text-link" href="mailto:wpein@qq.com">wpein@qq.com</a>。</p>
    </section>

    <p class="privacy-note">请不要发送密码、验证码或其他敏感信息。微信与邮件中的内容由相应平台处理，护栏 App 不会读取这些内容。</p>
  </main>
  <footer>© 2026 Pein Wang · 护栏</footer>
</body>
</html>
